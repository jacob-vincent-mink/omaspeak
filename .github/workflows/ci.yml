name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  AUDIOCPP_COMMIT: e9ff20042ec85af960a720368c6927cda19ad65f

jobs:
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,llvm-tools-preview,rustfmt
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2,cargo-deny@0.20.2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ git binutils libgomp1 util-linux
      - name: Build the pinned default audio.cpp provider
        run: |
          set -euo pipefail
          source="${RUNNER_TEMP}/audio.cpp"
          build="${RUNNER_TEMP}/audio.cpp-build"
          git clone --filter=blob:none https://github.com/0xShug0/audio.cpp.git "${source}"
          git -C "${source}" checkout "${AUDIOCPP_COMMIT}"
          provider=$(./scripts/build-default-audiocpp-provider.sh "${source}" "${build}")
          strip --strip-unneeded "${provider}"
          echo "AUDIOCPP_SOURCE=${source}" >> "${GITHUB_ENV}"
          echo "OMASPEAK_TEST_AUDIOCPP_LIBRARY=${provider}" >> "${GITHUB_ENV}"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo deny check licenses
      - run: cargo about generate about.hbs > /dev/null
      - name: Reject obsolete inference dependencies
        run: |
          set -euo pipefail
          ! rg -i 'onnxruntime|libsherpa|sherpa-onnx' Cargo.toml Cargo.lock src tests scripts README.md INSTALL.md ACCELERATOR_SETUP.md RUNTIME.md config.example.toml
          ! readelf -d "${OMASPEAK_TEST_AUDIOCPP_LIBRARY}" | grep -Ei 'onnxruntime|sherpa'
          test -s licenses/POCKETFFT-LICENSE
      - name: Coverage
        run: cargo llvm-cov --all-targets --locked --fail-under-lines 90.01 -- --test-threads=1
