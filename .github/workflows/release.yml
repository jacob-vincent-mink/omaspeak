name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  AUDIOCPP_COMMIT: e9ff20042ec85af960a720368c6927cda19ad65f

jobs:
  linux:
    name: linux-${{ matrix.package_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            package_arch: x86_64
          - runner: ubuntu-22.04-arm
            package_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PACKAGE_ARCH: ${{ matrix.package_arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates cmake curl g++ git libgomp1 ninja-build xz-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Build the pinned default audio.cpp provider
        run: |
          set -euo pipefail
          source="${RUNNER_TEMP}/audio.cpp"
          build="${RUNNER_TEMP}/audio.cpp-build"
          git clone --filter=blob:none https://github.com/0xShug0/audio.cpp.git "${source}"
          git -C "${source}" checkout "${AUDIOCPP_COMMIT}"
          provider=$(./scripts/build-default-audiocpp-provider.sh "${source}" "${build}")
          strip --strip-unneeded "${provider}"
          test "$(git -C "${source}" rev-parse HEAD)" = "${AUDIOCPP_COMMIT}"
          echo "AUDIOCPP_SOURCE=${source}" >> "${GITHUB_ENV}"
          echo "AUDIOCPP_PROVIDER=${provider}" >> "${GITHUB_ENV}"
          echo "OMASPEAK_TEST_AUDIOCPP_LIBRARY=${provider}" >> "${GITHUB_ENV}"

      - name: Test and build the runtime-neutral executable
        run: |
          cargo test --locked -- --test-threads=1
          cargo build --release --locked

      - name: Stage the release
        id: package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            tag_version=${GITHUB_REF_NAME#v}
            [[ "${tag_version}" == "${version}" ]] || {
              echo "Cargo.toml version ${version} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            }
            version=${tag_version}
          fi
          package="omaspeak-${version}-linux-${PACKAGE_ARCH}"
          root="dist/${package}"
          mkdir -p "${root}/lib" "${root}/licenses/AUDIOCPP-THIRD-PARTY"
          cargo about generate about.hbs > "${root}/licenses/RUST-DEPENDENCIES.txt"
          cp target/release/omaspeak "${root}/omaspeak"
          cp "${AUDIOCPP_PROVIDER}" "${root}/lib/libaudiocpp.so.0.1.0"
          ln -s libaudiocpp.so.0.1.0 "${root}/lib/libaudiocpp.so.0"
          ln -s libaudiocpp.so.0 "${root}/lib/libaudiocpp.so"
          while IFS= read -r -d '' license; do
            relative=${license#"${AUDIOCPP_SOURCE}/"}
            destination="${root}/licenses/AUDIOCPP-THIRD-PARTY/${relative}"
            mkdir -p "$(dirname "${destination}")"
            cp "${license}" "${destination}"
          done < <(find "${AUDIOCPP_SOURCE}" -type f \
            \( -iname 'license' -o -iname 'license.*' -o -iname 'copying*' -o -iname 'notice*' \) \
            -not -path '*/.git/*' -print0)
          cp LICENSE "${root}/licenses/OMASPEAK-LICENSE"
          cp THIRD_PARTY_NOTICES.md "${root}/licenses/OMASPEAK-THIRD-PARTY-NOTICES"
          cp THIRD_PARTY_NOTICES.md "${root}/THIRD_PARTY_NOTICES.md"
          cp licenses/SUPERTONIC-CODE-LICENSE "${root}/licenses/SUPERTONIC-CODE-LICENSE"
          cp licenses/LLAMA-CPP-LICENSE "${root}/licenses/LLAMA-CPP-LICENSE"
          cp licenses/POCKETFFT-LICENSE "${root}/licenses/POCKETFFT-LICENSE"
          cp README.md INSTALL.md ACCELERATOR_SETUP.md RUNTIME.md CHANGELOG.md RELEASE_NOTES.md DEMO.md config.example.toml "${root}/"
          cp -a assets benchmarks packaging "${root}/"
          tar -C dist -cJf "dist/${package}.tar.xz" "${package}"
          (cd dist && sha256sum "${package}.tar.xz" > "${package}.sha256")
          echo "name=${package}" >> "${GITHUB_OUTPUT}"

      - name: Verify the release contract
        run: |
          set -euo pipefail
          package='${{ steps.package.outputs.name }}'
          root="dist/${package}"
          binary="${root}/omaspeak"
          provider="${root}/lib/libaudiocpp.so.0.1.0"
          expected_version="${package#omaspeak-}"
          expected_version="${expected_version%-linux-${PACKAGE_ARCH}}"
          [[ "$("${binary}" --version)" == "omaspeak ${expected_version}" ]]
          [[ "$(readelf -d "${provider}" | sed -n 's/.*Library soname: \[\([^]]*\)\].*/\1/p')" == "libaudiocpp.so.0" ]]
          test "$(find "${root}/lib" -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(find "${root}/lib" -maxdepth 1 -type l | wc -l)" -eq 2
          test -L "${root}/lib/libaudiocpp.so.0"
          test -L "${root}/lib/libaudiocpp.so"
          for symbol in audiocpp_abi_version audiocpp_registry_create audiocpp_model_load audiocpp_session_create audiocpp_session_run audiocpp_result_audio; do
            nm -D --defined-only "${provider}" | grep "${symbol}@@AUDIOCPP_0" >/dev/null
          done
          ! nm -D --defined-only --format=posix "${provider}" | awk '$1 != "AUDIOCPP_0" && $1 !~ /^audiocpp_/ { print; rejected=1 } END { exit !rejected }'
          ! find "${root}" -type f \( -name 'audiocpp_cli' -o -name 'audiocpp_server' -o -name 'audiocpp_gguf' -o -name 'audiocpp_model_manager' \) | grep .
          if readelf -d "${binary}" | grep -Ei 'NEEDED.*(audiocpp|onnxruntime|sherpa|openvino|cuda|cudnn|hip|vulkan)'; then
            echo "release executable has a forbidden inference-runtime dependency" >&2
            exit 1
          fi
          ! readelf -d "${provider}" | grep -Ei 'NEEDED.*(onnxruntime|sherpa)'
          ! find "${root}" -iname '*onnxruntime*' -o -iname '*sherpa*' | grep .
          test -s "${root}/licenses/AUDIOCPP-THIRD-PARTY/LICENSE"
          test -s "${root}/licenses/AUDIOCPP-THIRD-PARTY/external/ggml/LICENSE"
          test -s "${root}/licenses/AUDIOCPP-THIRD-PARTY/external/sentencepiece/LICENSE"
          test -s "${root}/licenses/AUDIOCPP-THIRD-PARTY/external/sentencepiece/third_party/protobuf-lite/LICENSE"
          test -s "${root}/licenses/LLAMA-CPP-LICENSE"
          test -s "${root}/licenses/POCKETFFT-LICENSE"
          test -s "${root}/THIRD_PARTY_NOTICES.md"
          test "$(find "${root}/licenses/AUDIOCPP-THIRD-PARTY" -type f | wc -l)" -ge 10
          export XDG_CONFIG_HOME="${RUNNER_TEMP}/omaspeak-release/config"
          export XDG_DATA_HOME="${RUNNER_TEMP}/omaspeak-release/data"
          export XDG_CACHE_HOME="${RUNNER_TEMP}/omaspeak-release/cache"
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/omaspeak-release/run"
          mkdir -p "${XDG_RUNTIME_DIR}"
          "${binary}" setup runtime --json > "${RUNNER_TEMP}/runtime.json"
          python3 - "${RUNNER_TEMP}/runtime.json" "${provider}" <<'PY'
          import json, pathlib, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = pathlib.Path(sys.argv[2]).resolve()
          assert set(report["supported_capabilities"]) == {"cpu", "cuda", "vulkan", "hip", "openvino"}
          cpu = next(item for item in report["inventory"] if item["runtime"] == "default" and item["device"] == "cpu")
          assert cpu["loadable"] and cpu["ready"]
          assert not cpu["device_accessible"] and not cpu["evidence"]["model_inference_verified"]
          assert pathlib.Path(cpu["evidence"]["provider_path"]).resolve() == expected
          PY

      - name: File-only Supertonic GGUF smoke
        if: matrix.package_arch == 'x86_64'
        run: |
          set -euo pipefail
          package='${{ steps.package.outputs.name }}'
          binary="dist/${package}/omaspeak"
          export XDG_CONFIG_HOME="${RUNNER_TEMP}/omaspeak-smoke/config"
          export XDG_DATA_HOME="${RUNNER_TEMP}/omaspeak-smoke/data"
          export XDG_CACHE_HOME="${RUNNER_TEMP}/omaspeak-smoke/cache"
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/omaspeak-smoke/run"
          mkdir -p "${XDG_RUNTIME_DIR}"
          "${binary}" setup model --model supertonic-3-gguf --accept-license OpenRAIL-M
          "${binary}" say --no-play --out "${RUNNER_TEMP}/omaspeak-smoke.wav" "Release file only proof."
          test -s "${RUNNER_TEMP}/omaspeak-smoke.wav"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.xz
            dist/${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error

  publish:
    name: publish-linux-release
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: omaspeak-*-linux-*
          path: dist
          merge-multiple: true
      - name: Verify and combine checksums
        run: |
          set -euo pipefail
          cd dist
          for checksum in omaspeak-*.sha256; do sha256sum -c "${checksum}"; done
          sha256sum omaspeak-*.tar.xz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: omaspeak-linux-release-assets
          path: |
            dist/omaspeak-*.tar.xz
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/omaspeak-*.tar.xz
            dist/SHA256SUMS.txt
