name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      OMA_ORT_ROOT: /tmp/onnxruntime-linux-x64-1.29.0
      ORT_ARCHIVE_SHA256: c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba
      ORT_VERSION: 1.29.0
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Download the pinned CPU ONNX Runtime SDK
        run: |
          set -euo pipefail
          archive="/tmp/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          printf '%s  %s\n' "${ORT_ARCHIVE_SHA256}" "${archive}" | sha256sum -c -
          tar -C /tmp -xzf "${archive}"
          test -f "${OMA_ORT_ROOT}/include/onnxruntime_cxx_api.h"
          test -f "${OMA_ORT_ROOT}/lib/libonnxruntime.so.${ORT_VERSION}"

      - name: Build the runtime-neutral executable
        run: cargo build --release --locked

      - name: Stage the release
        id: package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            tag_version=${GITHUB_REF_NAME#v}
            [[ "${tag_version}" == "${version}" ]] || {
              echo "Cargo.toml version ${version} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            }
            version=${tag_version}
          fi
          package="omaspeak-${version}-linux-x86_64"
          mkdir -p "dist/${package}/lib" "dist/${package}/licenses"
          cargo about generate about.hbs > "dist/${package}/licenses/RUST-DEPENDENCIES.txt"
          cp target/release/omaspeak "dist/${package}/omaspeak"
          cp "${OMA_ORT_ROOT}/lib/libonnxruntime.so.${ORT_VERSION}" "dist/${package}/lib/"
          ln -s "libonnxruntime.so.${ORT_VERSION}" "dist/${package}/lib/libonnxruntime.so.1"
          ln -s libonnxruntime.so.1 "dist/${package}/lib/libonnxruntime.so"
          cp "${OMA_ORT_ROOT}/LICENSE" "dist/${package}/licenses/ONNX-RUNTIME-LICENSE"
          cp "${OMA_ORT_ROOT}/ThirdPartyNotices.txt" \
            "dist/${package}/licenses/ONNX-RUNTIME-THIRD-PARTY-NOTICES"
          cp LICENSE "dist/${package}/licenses/OMASPEAK-LICENSE"
          cp THIRD_PARTY_NOTICES.md "dist/${package}/licenses/OMASPEAK-THIRD-PARTY-NOTICES"
          cp licenses/SUPERTONIC-CODE-LICENSE "dist/${package}/licenses/SUPERTONIC-CODE-LICENSE"
          cp RUNTIME.md "dist/${package}/RUNTIME.md"
          cp README.md INSTALL.md ACCELERATOR_SETUP.md CHANGELOG.md RELEASE_NOTES.md DEMO.md config.example.toml "dist/${package}/"
          cp -a assets benchmarks packaging "dist/${package}/"
          tar -C dist -cJf "dist/${package}.tar.xz" "${package}"
          (cd dist && sha256sum "${package}.tar.xz" > SHA256SUMS.txt)
          echo "name=${package}" >> "${GITHUB_OUTPUT}"

      - name: Verify the release contract
        run: |
          set -euo pipefail
          package='${{ steps.package.outputs.name }}'
          smoke_root="${RUNNER_TEMP}/${package}-smoke"
          mkdir -p "${smoke_root}"
          tar -C "${smoke_root}" -xJf "dist/${package}.tar.xz"
          binary="${smoke_root}/${package}/omaspeak"
          for document in README.md INSTALL.md ACCELERATOR_SETUP.md CHANGELOG.md RELEASE_NOTES.md DEMO.md config.example.toml RUNTIME.md; do
            test -s "${smoke_root}/${package}/${document}"
          done
          test -s "${smoke_root}/${package}/assets/omaspeak-mark.svg"
          test -s "${smoke_root}/${package}/benchmarks/cuda-gb10-2026-09-14.md"
          test -s "${smoke_root}/${package}/packaging/systemd/omaspeak.service"
          expected_version="${package#omaspeak-}"
          expected_version="${expected_version%-linux-x86_64}"
          [[ "$("${binary}" --version)" == "omaspeak ${expected_version}" ]]
          "${binary}" setup runtime --json > /tmp/runtime.json
          python3 - <<'PY'
          import json
          with open("/tmp/runtime.json", encoding="utf-8") as handle:
              report = json.load(handle)
          actual = set(report["supported_capabilities"])
          expected = {"cpu", "openvino", "cuda"}
          if actual != expected:
              raise SystemExit(f"capabilities {sorted(actual)} != {sorted(expected)}")
          if not report["libraries"]["runtime_loadable"]["default"]:
              raise SystemExit("packaged CPU default is not reported loadable")
          cpu = next(item for item in report["inventory"] if item["runtime"] == "default" and item["device"] == "cpu")
          assert cpu["ready"] and cpu["loadable"] and cpu["device_accessible"]
          assert cpu["source"] == "package" and not cpu["configured"]
          PY
          legacy_config="${smoke_root}/legacy/config.toml"
          mkdir -p "$(dirname "${legacy_config}")"
          cat > "${legacy_config}" <<'TOML'
          [backend]
          kind = "sherpa-onnx"
          runtime = "default"
          device = "cpu"
          threads = 4
          fallback = "error"
          device_id = 0
          provider_config = ""

          [backend.options]

          [model]
          family = "supertonic"
          name = "supertonic-3-int8"
          directory = ""
          model_file = ""
          tokens_file = ""
          data_directory = ""
          duration_predictor = "duration_predictor.int8.onnx"
          text_encoder = "text_encoder.int8.onnx"
          vector_estimator = "vector_estimator.int8.onnx"
          vocoder = "vocoder.int8.onnx"
          tts_json = "tts.json"
          unicode_indexer = "unicode_indexer.bin"
          voice_style = "voice.bin"
          language = "en"
          steps = 5
          voice = 2
          noise_scale = 0.667
          noise_scale_w = 0.8
          length_scale = 1.0

          [model.options]

          [audio]
          device = "default"
          volume = 0.9

          [daemon]
          queue_capacity = 8
          max_text_bytes = 65536
          TOML
          "${binary}" --config "${legacy_config}" setup runtime \
            --runtime default --device cpu --apply > "${smoke_root}/legacy-runtime-apply.json"
          "${binary}" --config "${legacy_config}" config get --json \
            > "${smoke_root}/modern-config.json"
          LEGACY_CONFIG="${legacy_config}" \
            LEGACY_RESULT="${smoke_root}/legacy-runtime-apply.json" \
            MODERN_CONFIG="${smoke_root}/modern-config.json" \
            python3 - <<'PY'
          import json
          import os

          with open(os.environ["LEGACY_RESULT"], encoding="utf-8") as handle:
              result = json.load(handle)
          if not result["applied"]:
              raise SystemExit("legacy runtime selection was probed but not applied")

          with open(os.environ["MODERN_CONFIG"], encoding="utf-8") as handle:
              config = json.load(handle)
          assert config["backend"]["kind"] == "supertonic"
          assert config["backend"]["runtime"] == "default"
          assert config["backend"]["device"] == "cpu"
          assert config["backend"]["threads"] == 4
          assert config["model"]["voice"] == 2
          assert abs(config["audio"]["volume"] - 0.9) < 1e-6
          with open(os.environ["LEGACY_CONFIG"], encoding="utf-8") as handle:
              rewritten = handle.read()
          stale = {
              "provider_config",
              "model_file",
              "tokens_file",
              "data_directory",
              "noise_scale",
              "noise_scale_w",
              "length_scale",
              "sherpa-onnx",
          }
          retained = sorted(field for field in stale if field in rewritten)
          if retained:
              raise SystemExit(f"rewritten config retained legacy fields: {retained}")
          PY
          if readelf -d "${binary}" | grep -E 'NEEDED.*(onnxruntime|sherpa|openvino|cuda|cudnn|cublas|nvinfer)'; then
            echo "release executable must not link an inference runtime" >&2
            exit 1
          fi
          lib="dist/${package}/lib"
          for required in \
            libonnxruntime.so \
            libonnxruntime.so.1 \
            "libonnxruntime.so.${ORT_VERSION}"; do
            test -e "${lib}/${required}"
          done
          [[ $(find "${lib}" -maxdepth 1 \( -type f -o -type l \) | wc -l) == 3 ]]
          ! compgen -G "${lib}/libonnxruntime_providers_*.so*" >/dev/null
          ! compgen -G "${lib}/libsherpa-onnx*.so*" >/dev/null
          while IFS= read -r -d '' dso; do
            case "${dso#dist/${package}/}" in
              lib/libonnxruntime.so|lib/libonnxruntime.so.1|lib/libonnxruntime.so.${ORT_VERSION}) ;;
              *) echo "Forbidden bundled DSO: ${dso}" >&2; exit 1 ;;
            esac
          done < <(find "dist/${package}" -name '*.so*' -print0)
          licenses="dist/${package}/licenses"
          [[ $(find "${licenses}" -maxdepth 1 -type f | wc -l) == 6 ]]
          cmp "${OMA_ORT_ROOT}/LICENSE" "${licenses}/ONNX-RUNTIME-LICENSE"
          cmp "${OMA_ORT_ROOT}/ThirdPartyNotices.txt" \
            "${licenses}/ONNX-RUNTIME-THIRD-PARTY-NOTICES"
          cmp LICENSE "${licenses}/OMASPEAK-LICENSE"
          cmp THIRD_PARTY_NOTICES.md "${licenses}/OMASPEAK-THIRD-PARTY-NOTICES"
          cmp licenses/SUPERTONIC-CODE-LICENSE "${licenses}/SUPERTONIC-CODE-LICENSE"
          test -s "${licenses}/RUST-DEPENDENCIES.txt"
          LIB="${lib}" python3 - <<'PY'
          import ctypes
          import os

          lib = os.environ["LIB"]
          runtime = ctypes.CDLL(os.path.join(lib, "libonnxruntime.so"), mode=ctypes.RTLD_GLOBAL)
          runtime.OrtGetApiBase.restype = ctypes.c_void_p
          assert runtime.OrtGetApiBase()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.xz
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/${{ steps.package.outputs.name }}.tar.xz
            dist/SHA256SUMS.txt
