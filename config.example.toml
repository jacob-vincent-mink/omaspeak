[backend]
kind = "supertonic"
runtime = "default"
device = "auto"
threads = 2
fallback = "error"
device_id = 0

[backend.options]
# CUDA EP V2 examples (used when runtime = "cuda"):
# cudnn_conv_algo_search = "HEURISTIC"
# gpu_mem_limit = "4294967296"
# do_copy_in_default_stream = "1"
# Direct OpenVINO property examples (used when runtime = "openvino"):
# PERFORMANCE_HINT = "LATENCY"
# NPU_PLATFORM = "5010" # optional host-specific NPU property

[model]
family = "supertonic"
name = "supertonic-3-int8"
directory = ""
duration_predictor = "duration_predictor.int8.onnx"
text_encoder = "text_encoder.int8.onnx"
vector_estimator = "vector_estimator.int8.onnx"
vocoder = "vocoder.int8.onnx"
tts_json = "tts.json"
unicode_indexer = "unicode_indexer.bin"
voice_style = "voice.bin"
language = "en"
steps = 5
# Speaker ID shown by `omaspeak voices` (Supertonic: M1-M5 = 0-4, F1-F5 = 5-9).
voice = 0

[model.options]

[audio]
device = "default"
volume = 1.0

[daemon]
queue_capacity = 8
max_text_bytes = 65536
