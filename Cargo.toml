[package]
name = "omaspeak"
version = "0.0.2"
edition = "2024"
description = "Local Supertonic text-to-speech CLI and daemon with runtime-selectable inference backends"
license = "MIT"
repository = "https://github.com/jacob-vincent-mink/omaspeak"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", default-features = false, features = ["events"] }
hound = "3.5"
openvino = { version = "0.11.0", features = ["runtime-linking"] }
openvino-sys = { version = "0.11.0", features = ["runtime-linking"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
signal-hook = "0.3"
thiserror = "2"
toml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
unicode-normalization = "0.1"
unicode-width = "0.2"
libloading = "0.8"
