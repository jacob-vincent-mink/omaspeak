[package]
name = "omaspeak"
version = "0.1.0"
edition = "2024"

[features]
default = []
openvino = ["sherpa-onnx/shared"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
bzip2 = "0.5"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = { version = "=1.13.8", default-features = false }
tar = "0.4"
thiserror = "2"
toml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
